<div class="wrap reveal">
  <h2 class="sec-title">Pendaftaran jemaat</h2>
  <p class="sec-lead">Isi data berikut dan pengurus akan menghubungi Anda.</p>
  <form id="daftar-form" novalidate>
    <label>Nama lengkap <input name="nama" required autocomplete="name"></label>
    <label>Nomor WhatsApp <input name="telepon" type="tel" required autocomplete="tel"></label>
    <label>Email <input name="email" type="email" autocomplete="email"></label>
    <label>Alamat <textarea name="alamat" rows="3"></textarea></label>
    <button type="submit" class="btn btn-dark">Kirim pendaftaran</button>
    <p id="form-msg" role="status"></p>
  </form>
</div>
